<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#3166dc" />
  <meta name="description" content="Ulbraflow — classifique por área e data, organize todas as demandas em uma esteira e trabalhe com foco." />
  <title>Ulbraflow — Workspace</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/assets/icons/ulbraflow-blue-192.png" />
  <script defer src="./install-app.js"></script>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" type="image/png" href="./assets/icons/ulbraflow-blue-192.png" />
  <script defer src="./areas.js"></script>
  <script defer src="./workflow.js"></script>
  <script defer src="./cloud.js"></script>
  <script defer src="./calendar.js"></script>
  <script defer src="./gmail-review.js"></script>
  <script defer src="./time-report.js"></script>
  <script defer src="./report-pdf.js"></script>
  <script defer src="./share-target.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="app-shell" aria-busy="true">
    <aside class="sidebar" aria-label="Menu principal" inert>
      <a class="brand" href="#esteira" aria-label="Ulbraflow, início"><span class="brand-word"><span class="brand-u">Ulbra</span><span class="brand-flow">flow</span></span></a>
      <div class="sidebar-caption">PRINCIPAL</div>
      <nav id="sidebar-nav">
        <button type="button" data-page="entrada" class="active"><span class="nav-icon">↘</span><span>Entrada</span><span id="inbox-count" class="nav-count" hidden></span></button>
        <button type="button" data-page="esteira"><span class="nav-icon">▤</span><span>Esteira</span></button>
        <button type="button" data-page="foco"><span class="nav-icon">◉</span><span>Foco</span></button>
        <button type="button" data-page="projetos"><span class="nav-icon">▦</span><span>Áreas</span></button>
        <button type="button" data-page="meus-projetos"><span class="nav-icon">▣</span><span>Meus Projetos</span></button>
        <button type="button" data-page="agenda"><span class="nav-icon">▤</span><span>Agenda</span></button>
        <details class="project-nav-menu"><summary><span class="nav-icon">▣</span>Base de Projetos</summary><div id="project-template-menu"></div></details>
        <button type="button" data-page="alertas"><span class="nav-icon">♧</span><span>Alertas</span></button>
        <button type="button" data-page="tempo" class="time-nav"><span class="nav-icon">◷</span><span>Gestão do Tempo</span></button>
      </nav>
      <div class="sidebar-foot"><div class="avatar">UF</div><div><strong>Meu workspace</strong><small>Ulbraflow · versão local</small></div></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-identity"><div class="header-brand" aria-label="Ulbraflow"><img src="./assets/ulbraflow-blue-logo.png" alt="" width="32" height="32" /><span class="header-brand-word"><span class="brand-u">Ulbra</span><span class="brand-flow">Flow</span><span class="brand-dot">.</span></span></div><div class="breadcrumb">Meu workspace <span>/</span> <strong id="location-label">Entrada</strong></div></div>
        <div class="top-actions" inert><button id="account-button" type="button" class="button" data-action="account">Entrar com Google</button><button id="active-clock" type="button" class="active-clock" data-action="open-active">◉ Entrar em foco</button><button type="button" class="button primary" data-action="new-task">+ Nova demanda</button></div>
      </header>
      <main id="screen" class="screen" aria-live="polite" aria-busy="true">
        <div class="startup-heading"><div class="eyebrow">ULBRAFLOW / WORKSPACE</div><h1>Entrada</h1><p>Revise e-mails e registros manuais antes de incluí-los na esteira.</p></div>
        <section id="workspace-access" class="card startup-access"><p id="login-message" role="status">Carregando suas demandas…</p><div class="actionbar"><button id="google-login" type="button" class="button primary" hidden>Entrar com Google</button><button id="login-retry" type="button" class="button" hidden>Tentar novamente</button></div></section>
      </main>
    </div>
  </div>
  <div id="modal-backdrop" class="modal-backdrop hidden" role="presentation"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
