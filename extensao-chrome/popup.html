<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Conexão Uflow</title>
<style>*{box-sizing:border-box}body{font:13px/1.5 system-ui,sans-serif;color:#253b36;margin:0;width:340px;background:#eef6f3;border-top:3px solid #fbb640;padding:20px}h1{display:flex;align-items:center;gap:9px;margin:0;color:#045a52;font-size:25px;white-space:nowrap}h1 img{width:35px;height:35px;object-fit:contain;flex-shrink:0;border-radius:9px}.brand-flow{color:#fbb640}p{color:#5b7069}label{display:block;font-weight:650}input{font:inherit;display:block;width:100%;border:1px solid #c8dcd4;border-radius:8px;padding:10px;margin-top:6px;color:#253b36;background:#fff}input:focus{outline:2px solid #045a52;outline-offset:2px}button{font:inherit;width:100%;border:0;border-radius:9px;background:#045a52;color:white;padding:11px;font-weight:700;margin-top:15px;cursor:pointer}button:hover{background:#03463f}button:focus-visible{outline:3px solid #fbb640;outline-offset:3px}button:disabled{opacity:.5}#status{min-height:20px;margin-top:12px}small{display:block;color:#5b7069;margin-top:14px}</style></head>
<body><h1><img src="flow-mark.png" alt="" width="35" height="35"><span>U<span class="brand-flow">flow</span></span></h1><p>Abra um e-mail no Gmail e use o botão <strong>Incluir no Uflow</strong>, ao lado do assunto.</p>
<form id="connection-form"><label>Endereço do Uflow<input id="flow-url" type="url" required spellcheck="false"></label><button id="save" type="submit">Salvar conexão</button></form>
<div id="status" role="status"></div><small>A extensão mantém uma aba do Uflow em segundo plano para acessar suas áreas e salvar tarefas neste navegador.</small>
<script src="shared.js"></script><script src="popup.js"></script></body>
</html>
