name: Testes

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verificação sintática
        run: npm run check

      - name: Testes de regras, nuvem, Agenda e Gmail
        run: npm run test:unit

      - name: Políticas SQL (PGlite descartável)
        run: |
          npm install --prefix "$RUNNER_TEMP/pglite" --no-save --no-audit --no-fund @electric-sql/pglite@0.5.8
          FLOW_PGLITE_MODULE="$RUNNER_TEMP/pglite/node_modules/@electric-sql/pglite/dist/index.js" npm run test:sql

      - name: Playwright, Chromium e pdftotext
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
          # Os testes usam /usr/bin/chromium, como no ambiente de desenvolvimento.
          sudo ln -sf "$(find ~/.cache/ms-playwright -path '*/chrome-linux*/chrome' -type f | head -1)" /usr/bin/chromium

      - name: Testes de navegador
        run: npm run test:browser
